services:
  - type: web
    name: courtiq
    runtime: docker
    dockerfilePath: ./Dockerfile
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: courtiq-db
          property: connectionString
      - key: PORT
        value: "80"

databases:
  - name: courtiq-db
    databaseName: courtiq
    user: courtiq
    plan: free